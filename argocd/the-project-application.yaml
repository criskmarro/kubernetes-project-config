apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: the-project
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/criskmarro/kubernetes-project-config.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: project

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
